name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The only test (ThumbsTest) is a heavy OCR integration test that requires
      # native Tesseract and sample PDFs, so it is compiled but not executed on CI.
      - name: Build
        run: ./gradlew build testClasses -x test
